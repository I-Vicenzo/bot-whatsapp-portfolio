[project]
name = "bot-whatsapp-portfolio"
version = "1.0.0"
description = "Assistente virtual de clínica fictícia no WhatsApp, com núcleo determinístico e IA de reserva."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.1.8",
    "alembic>=1.20.1",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "httpx>=0.28.1",
    "argon2-cffi>=25.1.0",
    "itsdangerous>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.23.1",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = [
    "error",
    # Starlette 1.10 prefere httpx2 no TestClient; httpx segue necessário (envio + respx).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "PT",      # pytest style
    "RUF",
    "S",       # bandit
    "DTZ",     # datetimes com fuso
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S107", "S608", "DTZ001"]
# SQL de triggers montado só com constantes do próprio arquivo.
"migrations/**" = ["S608"]
