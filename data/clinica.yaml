faq:
  - keywords: [estacionamento, estacionar, vaga de carro]
    answer: Temos estacionamento gratuito para pacientes, com 12 vagas, no subsolo do prédio.
  - keywords: [pix, cartao, pagamento, pagar, forma de pagamento, dinheiro]
    answer: Aceitamos Pix, cartões de débito e crédito (até 3x sem juros) e dinheiro.
  - keywords: [documento, documentos, levar, carteirinha]
    answer: >-
      Traga um documento com foto e, se for usar convênio, a carteirinha do plano.
      Pedimos chegar 15 minutos antes do horário.
  - keywords: [acessibilidade, cadeira de rodas, elevador, rampa]
    answer: A clínica tem rampa de acesso, elevador e banheiro adaptado.
  - keywords: [teleconsulta, online, videochamada, remota]
    answer: >-
      No momento atendemos apenas presencialmente. Para dúvidas, fale com a recepção
      pelo telefone da clínica.
  - keywords: [resultado, resultados, exame, exames]
    answer: >-
      Resultados de exames são entregues na recepção ou enviados por e-mail.
      Não informamos resultados por aqui, para proteger seus dados.
