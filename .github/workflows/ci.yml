name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Formatação
        run: uv run ruff format --check

      - name: Testes
        run: uv run pytest --cov

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --locked

      - name: Instalar Chromium
        run: uv run playwright install --with-deps chromium

      - name: Testes no navegador (Playwright)
        run: uv run pytest -m e2e
